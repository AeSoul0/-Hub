name: A.U.R.O.R.A. 100/100 Final CI Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: aehub_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: aehub_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aehub_user -d aehub_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # =========================================================================
      # SOURCE CHECKOUT
      # =========================================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================================
      # RUNTIME TOOLCHAINS
      # =========================================================================

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # =========================================================================
      # BACKEND DEPENDENCIES
      # =========================================================================

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx
          pip install -r requirements.txt

      # =========================================================================
      # BACKEND CODE QUALITY
      # =========================================================================

      - name: Run Ruff Linter & Formatter Check
        working-directory: backend
        run: |
          ruff check .

      # =========================================================================
      # BACKEND TEST SUITE
      # =========================================================================

      - name: Run Unit and E2E Tests (M16 Gates)
        working-directory: backend
        env:
          POSTGRES_URL: postgresql://aehub_user:password@localhost:5432/aehub_db
          REDIS_URL: redis://localhost:6379/0
          AEHUB_SECRET_KEY: ci-test-secret-key
          GROQ_API_KEY: ci-test-groq-key
          AEHUB_TELEMETRY_CONSOLE: "0"
          PYTHONPATH: .
        run: |
          pytest ../tests/ -v --import-mode=importlib

      # =========================================================================
      # FRONTEND DEPENDENCIES
      # =========================================================================

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      # =========================================================================
      # FRONTEND SECURITY AUDIT
      # =========================================================================

      - name: Audit Frontend Dependencies
        working-directory: frontend
        run: |
          npm audit --audit-level=high

      # =========================================================================
      # FRONTEND BUILD
      # =========================================================================

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm run build

      # =========================================================================
      # SECURITY SCANNING
      # =========================================================================

      - name: Container Scanning (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

      # =========================================================================
      # FINAL CERTIFICATION
      # =========================================================================

      - name: 100/100 Certification Script
        run: |
          python evals/certify_100_100.py
