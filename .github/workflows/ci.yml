name: A.U.R.O.R.A. 100/100 Final CI Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: aehub_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: aehub_db
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      # =========================================================================
      # SOURCE CHECKOUT
      # =========================================================================

      - uses: actions/checkout@v3

      # =========================================================================
      # RUNTIME TOOLCHAINS
      # =========================================================================

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # =========================================================================
      # BACKEND DEPENDENCIES
      # =========================================================================

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install ruff pytest httpx
          pip install -r requirements.txt

      # =========================================================================
      # BACKEND CODE QUALITY
      # =========================================================================

      - name: Run Ruff Linter & Formatter Check
        working-directory: backend
        run: |
          ruff check .

      # =========================================================================
      # BACKEND TEST SUITE
      #
      # Application code lives under backend/app while tests live at the
      # repository root. Running pytest from backend ensures the backend
      # pyproject.toml is discovered and "app.*" imports resolve correctly.
      # CI-only credentials below are non-production placeholders used solely
      # to satisfy Settings validation during module import.
      # =========================================================================

      - name: Run Unit and E2E Tests (M16 Gates)
        working-directory: backend
        env:
          POSTGRES_URL: postgresql://aehub_user:password@localhost:5432/aehub_db
          REDIS_URL: redis://localhost:6379/0
          AEHUB_SECRET_KEY: ci-test-secret-key
          GROQ_API_KEY: ci-test-groq-key
          PYTHONPATH: .
        run: |
          pytest ../tests/ -v

      # =========================================================================
      # FRONTEND
      # =========================================================================

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm install

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm run build

      # =========================================================================
      # SECURITY SCANNING
      # =========================================================================

      - name: Container Scanning (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      # =========================================================================
      # FINAL CERTIFICATION
      # =========================================================================

      - name: 100/100 Certification Script
        run: |
          python evals/certify_100_100.py