# ==============================================================================
# MULTI-CONTAINER ORCHESTRATION MANIFEST
# Defines the isolated network topology and persistent storage volumes
# ==============================================================================


services:
  # ---------------------------------------------------------
  # BACKEND SERVICE NODE (FastAPI + AI Orchestrator)
  # ---------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aehub-backend
    ports:
      - "3002:3002"
    volumes:
      # PERSISTENT STORAGE: Map local directories to prevent data loss on container restarts
      - ./backend/audio_cache:/app/audio_cache
      - ./backend/temp_downloads:/app/temp_downloads
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - aehub-network

  # ---------------------------------------------------------
  # FRONTEND SERVICE NODE (Next.js Dashboard)
  # ---------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aehub-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aehub-network

  # ---------------------------------------------------------
  # DATABASE (PostgreSQL with pgvector for M4)
  # ---------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: aehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aehub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aehub_db}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - aehub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aehub_user -d aehub_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # CELERY WORKER (Async Tasks for M2.5)
  # ---------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aehub-celery
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./backend/audio_cache:/app/audio_cache
      - ./backend/temp_downloads:/app/temp_downloads
      - ./workspace/chromadb:/app/workspace/chromadb
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
      - backend
    restart: unless-stopped
    networks:
      - aehub-network

  # ---------------------------------------------------------
  # CACHE & EVENT BUS (Redis)
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aehub-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    networks:
      - aehub-network

# Define a private software-defined network for secure inter-container communication
networks:
  aehub-network:
    driver: bridge