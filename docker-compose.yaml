# ==============================================================================
# MULTI-CONTAINER ORCHESTRATION MANIFEST
# Defines the isolated network topology and persistent storage volumes
# ==============================================================================

services:
  # ---------------------------------------------------------
  # BACKEND SERVICE NODE (FastAPI + AI Orchestrator)
  # ---------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: aehub-backend
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      # PERSISTENT STORAGE: the agent's working folder (AEHUB_ALLOWED_DIRS)
      # survives container restarts. `python scripts/aehub.py setup` can point
      # it at another folder (AEHUB_WORKSPACE_DIR in .env).
      - ${AEHUB_WORKSPACE_DIR:-./workspace}:/app/workspace
      # Local voice models (M15): downloaded once, kept across rebuilds.
      - ./data/voice:/app/voice-models
      # Home device file (M15), read-only and outside the agent's working
      # folder: set AEHUB_HOME_DEVICES=/app/config/home.json in backend/.env.
      - ./config:/app/config:ro
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-aehub_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aehub_db}
      - REDIS_URL=redis://redis:6379/0
      - AEHUB_VOICE_MODELS_DIR=/app/voice-models
      # SECRETS (M12): read from the OS keyring by `python scripts/aehub.py up`
      # and passed through this process environment, never from a file. They
      # override backend/.env, which keeps only non-secret settings.
      - AEHUB_SECRET_KEY=${AEHUB_SECRET_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - AEHUB_MQTT_PASSWORD=${AEHUB_MQTT_PASSWORD:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - AEHUB_LOCAL_API_KEY=${AEHUB_LOCAL_API_KEY:-}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - aehub-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------
  # FRONTEND SERVICE NODE (Next.js Dashboard)
  # ---------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: aehub-frontend
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: ./frontend/.env.local
        required: false
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3002
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aehub-network

  # ---------------------------------------------------------
  # DATABASE (PostgreSQL with pgvector for M4)
  # ---------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: aehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aehub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (make demo creates it)}
      POSTGRES_DB: ${POSTGRES_DB:-aehub_db}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - aehub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aehub_user -d aehub_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # CACHE & EVENT BUS (Redis)
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aehub-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    networks:
      - aehub-network

# Define a private software-defined network for secure inter-container communication
networks:
  aehub-network:
    driver: bridge