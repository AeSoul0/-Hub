# Optional NVIDIA GPU access for the backend and the Celery worker
# (local speech and vision models). Use it on top of the base file:
#
#   docker compose -f docker-compose.yaml -f docker-compose.gpu.yaml up -d
#
# Without it the stack runs on any machine with Docker, GPU or not.

services:
  backend:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  celery-worker:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
