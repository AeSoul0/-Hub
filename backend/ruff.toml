[lint]
ignore = [
    "E", "B", "W", "UP", "DTZ", "SIM", "PIE", "I", "ASYNC", "RUF", "S", "TRY"
]
# R1: a blind `except Exception` needs a reason (`# noqa: BLE001 - why`) and,
# unless it re-raises or reports the error, a log line.
# Pyflakes (F): unused imports and variables, undefined names, redefinitions;
# a re-export keeps its import with `# noqa: F401 - why`.
extend-select = ["BLE001"]
